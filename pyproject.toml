[project]
name = "pdf-extraction-pipeline"
version = "0.1.0"
description = "STEM Textbook PDF Extraction Pipeline using Docling and Granite VLM"
readme = "README.md"
authors = [
    { name = "MriteshAdak", email = "mriteshadak@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docling[vlm]>=2.149.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
